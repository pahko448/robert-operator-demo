<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吉利根 · 内容工作台演示</title><link rel="stylesheet" href="baseline.css"><link rel="stylesheet" href="demo.css"><link rel="stylesheet" href="workflow-v2.css?v=20261016-simple-2"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">R</span><div><strong>内容工作台</strong><small>内部业务系统 · 本地流程演示</small></div></div><div class="account-actions"><label>当前业务<select id="business"><option value="gilligan">吉利根</option><option value="robert">Robert（原工作台）</option></select></label><label>演示身份<select id="identity"><option value="member">演示成员</option><option value="admin">演示管理员</option></select></label></div></header>
<div class="demo-banner">本地 Demo：仅合成材料与固定模拟结果，不调用真实 AI，不读取真实账号或知识库。记录仅在当前浏览器保存。</div>
<div id="workspace" class="workspace"><aside class="sidebar"><button id="sidebar-toggle" class="sidebar-toggle" aria-label="收起左侧导航" aria-expanded="true"><span>‹</span></button><nav><button class="nav-item active" data-page="creator"><span>＋</span><span class="nav-label">新建内容</span></button><button class="nav-item" data-page="history"><span>▤</span><span class="nav-label">历史成稿</span></button><button class="nav-item" data-page="reviews"><span>✓</span><span class="nav-label" id="review-nav">我的提交</span></button></nav><div class="sidebar-note"><strong>内容边界</strong><p>学问与表达分开评价；原话须核验，缺依据不补造。个人标记不自动共享。</p></div></aside>
<main class="workspace-main"><section id="creator-page"><header class="page-header"><div><p class="eyebrow">吉利根 · 内容生产</p><h1>新建内容</h1></div><button id="fill-sample" class="button ghost">填入演示素材</button></header><div id="robert-note" class="notice hidden">Robert 原有功能不受影响。本地样板只实现吉利根流程，切回吉利根即可体验。</div><div id="gilligan-form"><div class="business-switch" aria-label="处理方式"><button class="business-tab" data-operation="generate" aria-pressed="true"><span class="tab-icon">文</span><span><strong>初稿生成</strong><small>基于素材或选题形成可编辑文案</small></span></button><button class="business-tab" data-operation="evaluate" aria-pressed="false"><span class="tab-icon">评</span><span><strong>文案评估</strong><small>学问忠实度与表达贴近度</small></span></button><button class="business-tab" data-operation="search" aria-pressed="false"><span class="tab-icon">检</span><span><strong>知识检索</strong><small>查找依据并查看来源</small></span></button></div>
<form id="task-form" class="content-panel"><fieldset><label class="field"><span id="material-label" class="field-label">原始素材或选题方向 <strong>必填</strong></span><textarea id="material" maxlength="12000" placeholder="粘贴原稿或填写选题；可点击“填入演示素材”体验完整流程。" required></textarea><span class="field-meta">请使用合成材料，不要输入真实个人信息。</span></label><label class="field"><span class="field-label">本次要求 <span class="optional">可选</span></span><textarea id="requirements" placeholder="例如：温和坚定，减少说教，结尾保留开放式问题"></textarea></label><label class="field"><span class="field-label">必须保留项 <span class="optional">可选</span></span><textarea id="retain" placeholder="本次不能删改的观点或句子"></textarea></label><label class="test-control">演示场景<select id="scenario"><option value="available">有可用演示依据</option><option value="missing">依据不足</option><option value="offline">执行服务离线</option><option value="quota">额度不足</option></select></label><div class="submit-group"><span class="authorization-note">演示输出不代表吉利根原话或实际效果。</span><button id="submit" class="button primary">生成初稿</button></div></fieldset></form></div></section>
<section id="result-page" class="hidden" aria-live="polite"></section>
<section id="history-page" class="hidden"><header class="page-header"><div><p class="eyebrow">吉利根 · 本地记录</p><h1>历史成稿</h1></div><button class="button primary" data-page="creator">＋ 新建内容</button></header><div class="filter-row content-panel"><label>搜索成稿<input id="history-search" placeholder="输入标题或正文关键词"></label><label>优质状态<select id="quality-filter"><option value="all">全部状态</option><option value="personal">个人已标记</option><option value="team">团队已纳入</option></select></label></div><p id="history-count" class="muted"></p><div id="history-list"></div></section>
<section id="reviews-page" class="hidden"><header class="page-header"><div><p class="eyebrow">吉利根 · 参考闭环</p><h1 id="reviews-title">我的提交</h1></div></header><p class="muted">成员提交后由管理员审核；管理员可以直接纳入。保留提交内容、提交人和审核版本。</p><div id="reviews-list"></div></section><p id="toast" role="status"></p></main></div>
<dialog id="review-dialog"><div id="review-detail"></div><button id="close-dialog" class="button ghost">关闭</button></dialog><script src="config.js"></script><script src="adapter.js"></script><script src="app.js"></script><script src="flow.js"></script><script src="workflow-v2.js?v=20261016-simple-2"></script><script src="version-safety.js"></script><script src="review-fixes.js?v=20261016-simple-2"></script><script src="knowledge-browser.js?v=20261016-1"></script></body></html>
